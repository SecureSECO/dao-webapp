name: UI Tests

on:
  workflow_dispatch:
  push:
    branches: ['master', 'dev']
  pull_request:
    branches: ['master', 'dev']

env:
  NODE_VERSION: 22.x

jobs:
  # Install and cache npm dependencies
  install-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node modules
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            **/node_modules
          key: ui-ubuntu-24.04-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies if cache invalid
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
  # Run Jest unit tests
  jest-unit-tests:
    runs-on: ubuntu-24.04
    needs: install-cache
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore npm cache
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            **/node_modules
          key: ui-ubuntu-24.04-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: run tests
        run: npm run test
  # Run interaction and accessibility tests with Axe
  interaction-and-accessibility-tests:
    runs-on: ubuntu-24.04
    needs: install-cache
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore npm cache
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            **/node_modules
          key: ui-ubuntu-24.04-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Build Storybook
        env:
          # Stories render without an authenticated WalletConnect session.
          VITE_APP_PROJECT_ID: '00000000000000000000000000000000'
        run: npm run build-storybook -- --quiet
      - name: Serve Storybook and run tests
        run: |
          ./node_modules/.bin/http-server storybook-static -a 127.0.0.1 -p 6006 -s &
          storybook_pid=$!
          trap 'kill "$storybook_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6006/index.json -o /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:6006/index.json -o /dev/null
          npm run test-storybook -- --url http://127.0.0.1:6006 --maxWorkers=2
